<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEKION公式サイト</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+JP:wght@300;400;600&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-layer">
        <div class="bg-pattern"></div>
        <div class="bg-lines">
            <span></span><span></span><span></span><span></span>
        </div>
    </div>

    <!-- ヘッダー共通部分 -->
    <div id="header-container"></div>

    <section class="mv" id="mv">
        <div class="mv-bg"></div>
        <img src="images/logo/gold_hekionlogo.png" class="mv-logo" alt="HEKION">
        <h1 class="mv-copy">発見、楽しさ、繋がり。</h1>
    </section>

    <main class="main-content">
        <section class="concept-body reveal">
            <div class="section-title-wrap">
                <span class="section-num">01</span>
                <h2 class="section-title">CONCEPT</h2>
            </div>
            <p class="concept-text">日常のなかの発見を楽しさに変え、<br>そこから繋がりを生み出していく。</p>
        </section>

        <section class="project-section">
            <div class="section-title-wrap reveal">
                <span class="section-num">02</span>
                <h2 class="section-title">PROJECT</h2>
            </div>
            
            <div class="project-grid">
                <div class="project-card card-ganar reveal">
                    <div class="card-inner">
                        <div class="card-logo-wrap">
                            <img src="images/logo/ganarlogo.png" class="card-logo" alt="GANAR">
                        </div>
                        <div class="card-body-text">
                            <p class="card-desc">楽しんだもん勝ち</p>
                            <a href="projects/ganar.html" class="btn-viewmore"><span>VIEW MORE</span><i class="fas fa-arrow-right"></i></a>
                        </div>
                    </div>
                </div>

                <!--
                <div class="project-card card-goalink reveal">
                    <div class="card-inner">
                        <div class="card-logo-wrap">
                            <img src="images/logo/goalinklogo.png" class="card-logo" alt="Goalink">
                        </div>
                        <div class="card-body-text">
                            <p class="card-desc">サッカーと人をつなぐ</p>
                            <a href="projects/goalink.html" class="btn-viewmore"><span>VIEW MORE</span><i class="fas fa-arrow-right"></i></a>
                        </div>
                    </div>
                </div>
                -->

                <div class="project-card card-travid reveal">
                    <div class="card-inner">
                        <div class="card-logo-wrap">
                            <img src="images/logo/travidlogo.png" class="card-logo" alt="TRAVID">
                        </div>
                        <div class="card-body-text">
                            <p class="card-desc">旅の楽しさを、カタチに</p>
                            <a href="projects/travid.html" class="btn-viewmore"><span>VIEW MORE</span><i class="fas fa-arrow-right"></i></a>
                        </div>
                    </div>
                </div>

                <!--
                <div class="project-card card-veresis reveal">
                    <div class="card-inner">
                        <div class="card-logo-wrap">
                            <img src="images/logo/veresislogo.png" class="card-logo" alt="VERESIS">
                        </div>
                        <div class="card-body-text">
                            <p class="card-desc">世界は、変えられる</p>
                            <a href="projects/veresis.html" class="btn-viewmore"><span>VIEW MORE</span><i class="fas fa-arrow-right"></i></a>
                        </div>
                    </div>
                </div>
                -->
            </div>
        </section>

        <section class="news-section reveal">
            <div class="section-title-wrap">
                <span class="section-num">03</span>
                <h2 class="section-title">NEWS</h2>
            </div>
            <div id="news-container">
                <p class="news-loading">Loading news...</p>
            </div>
            <div class="news-btn-area">
                <a href="news.html" class="btn-news-more"><span>VIEW MORE</span><i class="fas fa-arrow-right"></i></a>
            </div>
        </section>
    </main>

    <!-- フッター共通部分 -->
    <div id="footer-container"></div>

    <a href="#" class="pagetop" id="pageTop"></a>

    <script src="script.js"></script>
</body>
</html>
