<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEWS | HEKION公式サイト</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+JP:wght@300;400;600&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-layer">
        <div class="bg-pattern"></div>
        <div class="bg-lines">
            <span></span><span></span><span></span><span></span>
        </div>
    </div>

    <!-- ヘッダー共通部分 -->
    <div id="header-container"></div>

    <div id="page-container">
        <section class="page-head">
            <h1>NEWS</h1>
            <p>ニュース</p>
        </section>

        <main class="main-content">
            <div class="filter-area">
                <button class="filter-btn active" data-filter="ALL">ALL</button>
                <button class="filter-btn" data-filter="HEKION">HEKION</button>
                <button class="filter-btn" data-filter="GANAR">GANAR</button>
                <!-- <button class="filter-btn" data-filter="Goalink">Goalink</button> -->
                <button class="filter-btn" data-filter="TRAVID">TRAVID</button>
                <!-- <button class="filter-btn" data-filter="VERESIS">VERESIS</button> -->
            </div>

            <div id="news-list" class="news-list">
                <p class="status-msg">Loading news...</p>
            </div>

            <div id="pagination" class="pagination"></div>
        </main>
    </div>

    <!-- フッター共通部分 -->
    <div id="footer-container"></div>

    <a href="#" class="pagetop" id="pageTop"></a>

    <script src="script.js"></script>
    <script>
        const endpoint = "https://script.google.com/macros/s/AKfycbxsimQpAMn1nBVO2Kp5tqby_KeX-8Tk3Me8WVokGIVbaUmF2EdtmXCXdtXSskSYsAf1/exec";
        let allNewsData = [];
        let filteredData = [];
        const itemsPerPage = 10;
        let currentPage = 1;

        window.addEventListener('DOMContentLoaded', () => {
            fetchNews();
        });

        async function fetchNews() {
            const container = document.getElementById('news-list');
            try {
                const response = await fetch(endpoint);
                allNewsData = await response.json();
                updateFilter('ALL');
            } catch (error) {
                container.innerHTML = '<p class="status-msg">ニュースの読み込みに失敗しました。</p>';
            }
        }

        function updateFilter(filter) {
            currentPage = 1;
            filteredData = filter === 'ALL' 
                ? allNewsData 
                : allNewsData.filter(item => item.tag === filter);
            renderNews();
            renderPagination();
        }

        function renderNews() {
            const container = document.getElementById('news-list');
            container.innerHTML = '';

            if (filteredData.length === 0) {
                container.innerHTML = '<p class="status-msg">該当するニュースはありません。</p>';
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = filteredData.slice(startIndex, endIndex);

            pageData.forEach(item => {
                const html = `
                    <a href="newspage.html?id=${item.id}" class="news-item">
                        <div class="news-meta">
                            <span class="news-date">${item.date}</span>
                            <span class="news-tag">${item.tag}</span>
                        </div>
                        <div class="news-text">${item.title}</div>
                    </a>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            container.innerHTML = '';

            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const link = document.createElement('a');
                link.href = '#';
                link.textContent = i;
                link.className = `page-link ${i === currentPage ? 'active' : ''}`;
                link.onclick = (e) => {
                    e.preventDefault();
                    currentPage = i;
                    renderNews();
                    renderPagination();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                container.appendChild(link);
            }
        }

        // Filter Logic
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.onclick = () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                updateFilter(btn.dataset.filter);
            };
        });
    </script>
</body>
</html>
