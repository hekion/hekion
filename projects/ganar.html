<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GANAR | HEKION公式サイト</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+JP:wght@300;400;600&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        /* GANAR固有の個別スタイル定義 */
        :root {
            --ganar-blue: #87ceeb;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            background-image: url('bg_ganar.png');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: rgba(135, 206, 235, 0.4);
            z-index: 2;
        }

        .project-theme {
            color: var(--ganar-blue);
        }

        .btn-site {
            background: var(--ganar-blue);
            color: var(--bg-navy, #0a111f);
            font-weight: bold;
        }

        .btn-site:hover {
            background: #ffffff;
        }
    </style>
</head>
<body>
    <div class="bg-layer">
        <div class="bg-pattern"></div>
        <div class="bg-lines">
            <span></span><span></span><span></span><span></span>
        </div>
    </div>

    <!-- ヘッダー共通部分 -->
    <div id="header-container"></div>

    <div id="page-container">
        <section class="project-hero">
            <div class="hero-bg"></div>
            <div class="hero-overlay"></div>
            <img src="ganarlogo.png" alt="GANAR" class="hero-logo">
        </section>

        <main class="main-content">
            <h1 class="project-theme">楽しんだもん勝ち</h1>
            
            <div class="project-description">
                <p>GANARは、勝利にこだわりながらも、<br>
                「楽しむこと」を何より大切にするゲーミングプロジェクトです。</p>
                <p style="margin-top: 30px;">結果だけではなく、過程や熱量、<br>
                一緒にプレイする時間そのものを価値として捉えています。</p>
                <p style="margin-top: 30px;">競技でも、エンジョイでも。<br>
                本気で向き合うからこそ、楽しめる。<br>
                GANARはそんな場所を目指しています。</p>
            </div>

            <div class="link-section">
                <a href="https://hekion.github.io/ganar/index.html" class="btn-project btn-site" target="_blank" rel="noopener noreferrer">OFFICIAL SITE</a>
                <a href="https://x.com/GANAR_games" class="btn-project btn-x" target="_blank" rel="noopener noreferrer"><i class="fab fa-x-twitter"></i> X (Twitter)</a>
            </div>
        </main>
    </div>

    <!-- フッター共通部分 -->
    <div id="footer-container"></div>

    <a href="#" class="pagetop" id="pageTop"></a>

    <script src="../script.js"></script>
    <script>
        window.addEventListener('load', () => {
            document.body.classList.add('loaded');
        });
    </script>
</body>
</html>
