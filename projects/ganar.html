<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GANAR | HEKION公式サイト</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+JP:wght@300;400;600&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        /* GANAR固有の個別スタイル定義 */
        :root {
            --ganar-blue: #87ceeb;
        }

        /* ヒーローエリアデザイン */
        .project-hero {
            width: 100%;
            height: 50vh;
            min-height: 360px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-bottom: 1px solid rgba(195, 160, 89, 0.2);
            background: radial-gradient(circle at center, rgba(135, 206, 235, 0.12) 0%, rgba(10, 17, 31, 0.95) 75%);
        }

        .hero-logo {
            position: relative;
            z-index: 10;
            width: 320px;
            max-width: 75%;
            object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(135, 206, 235, 0.35));
            opacity: 0;
            transform: scale(0.92) translateY(10px);
            transition: opacity 1.2s cubic-bezier(0.19, 1, 0.22, 1), transform 1.2s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .loaded .hero-logo {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .project-theme {
            font-family: 'Sawarabi Mincho', 'Noto Serif JP', serif;
            font-size: 2.2rem;
            color: var(--ganar-blue);
            text-align: center;
            letter-spacing: 0.3em;
            margin-bottom: 60px;
            text-shadow: 0 0 20px rgba(135, 206, 235, 0.2);
        }

        .project-description {
            font-size: 1.15rem;
            line-height: 2.4;
            text-align: center;
            font-weight: 300;
        }

        .link-section {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 80px;
        }

        .btn-project {
            width: 220px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 1rem;
            letter-spacing: 0.2em;
            border-radius: 4px;
            transition: 0.3s;
        }

        .btn-site {
            background: var(--ganar-blue);
            color: var(--bg-navy, #0a111f);
            font-weight: bold;
        }

        .btn-site:hover {
            background: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .btn-x {
            border: 1px solid #ffffff;
            color: #ffffff;
        }

        .btn-x:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-project i {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .project-hero {
                height: 40vh;
                min-height: 280px;
            }

            .hero-logo {
                width: 240px;
            }

            .project-theme {
                font-size: 1.6rem;
                letter-spacing: 0.2em;
            }

            .project-description {
                font-size: 1rem;
                text-align: left;
            }

            .link-section {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            .btn-project {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-layer">
        <div class="bg-pattern"></div>
        <div class="bg-lines">
            <span></span><span></span><span></span><span></span>
        </div>
    </div>

    <!-- ヘッダー共通挿入エリア -->
    <div id="header-container"></div>

    <div id="page-container">
        <section class="project-hero">
            <img src="../images/logo/ganarlogo.png" alt="GANAR" class="hero-logo">
        </section>

        <main class="main-content">
            <h1 class="project-theme">楽しんだもん勝ち</h1>
            
            <div class="project-description">
                <p>GANARは、勝利にこだわりながらも、<br>
                「楽しむこと」を何より大切にするゲーミングプロジェクトです。</p>
                <p style="margin-top: 30px;">結果だけではなく、過程や熱量、<br>
                一緒にプレイする時間そのものを価値として捉えています。</p>
                <p style="margin-top: 30px;">競技でも、エンジョイでも。<br>
                本気で向き合うからこそ、楽しめる。<br>
                GANARはそんな場所を目指しています。</p>
            </div>

            <div class="link-section">
                <a href="https://hekion.github.io/ganar/index.html" class="btn-project btn-site" target="_blank" rel="noopener noreferrer">OFFICIAL SITE</a>
                <a href="https://x.com/GANAR_games" class="btn-project btn-x" target="_blank" rel="noopener noreferrer"><i class="fab fa-x-twitter"></i> X (Twitter)</a>
            </div>
        </main>
    </div>

    <!-- フッター共通挿入エリア -->
    <div id="footer-container"></div>

    <a href="#" class="pagetop" id="pageTop"></a>

    <script src="../script.js"></script>
    <script>
        window.addEventListener('load', () => {
            document.body.classList.add('loaded');
        });
    </script>
</body>
</html>
