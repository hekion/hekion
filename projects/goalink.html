    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+JP:wght@300;400;600&family=Sawarabi+Mincho&display=swap" rel="stylesheet">

    <div class="bg-layer">

        <section class="project-hero hero-goalink">
            <img src="../images/logo/goalinklogo.png" alt="Goalink" class="hero-logo">

        <main class="main-content">
            <h1 class="project-theme theme-goalink">サッカーと人をつなぐ</h1>
            
            <div class="project-description">
                <p>Goalinkは、試合の記録やデータを通して、<br>
                サッカーをもっと身近に感じてもらうためのプロジェクトです。</p>
                <p style="margin-top: 30px;">試合結果、スターティングメンバー、スタッツ。<br>
                「知る」ことで、サッカーはもっと面白くなる。</p>
                <p style="margin-top: 30px;">情報を整理し、残し、伝えることで、<br>
                サッカーと人の距離を縮めていきます。</p>
            </div>

            <div class="link-section">
                <a href="https://hekion.github.io/goalinkjp/index.html" class="btn-project btn-goalink-site" target="_blank" rel="noopener noreferrer">OFFICIAL SITE</a>
