<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRAVID | HEKION公式サイト</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+JP:wght@300;400;600&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="bg-layer">
        <div class="bg-pattern"></div>
        <div class="bg-lines">
            <span></span><span></span><span></span><span></span>
        </div>
    </div>

    <!-- ヘッダー共通挿入エリア -->
    <div id="header-container"></div>

    <div id="page-container">
        <section class="project-hero hero-travid">
            <img src="../images/logo/travidlogo.png" alt="TRAVID" class="hero-logo">
        </section>

        <main class="main-content">
            <h1 class="project-theme theme-travid">旅の楽しさを、カタチに。</h1>
            
            <div class="project-description">
                <p>TRAVIDは、旅そのものだけでなく、<br>
                旅の前後に生まれるワクワクや余韻も大切にするプロジェクトです。</p>
                <p style="margin-top: 30px;">行き先を調べている時間、<br>
                誰かと計画を立てている時間、<br>
                そして旅が終わったあとに振り返る時間。<br>
                そのすべてが、旅の楽しさだと考えています。</p>
                <p style="margin-top: 30px;">写真や記録、言葉として残すことで、<br>
                旅は一度きりの体験ではなく、何度でも楽しめるものになる。</p>
                <p style="margin-top: 30px;">TRAVIDは、<br>
                旅の楽しさを「体験」と「記録」の両方で味わえる場所を目指しています。</p>
            </div>

            <div class="link-section">
                <a href="https://www.go-travid.com" class="btn-project btn-travid" target="_blank" rel="noopener noreferrer"><i class="fas fa-globe"></i> OFFICIAL SITE</a>
            </div>
        </main>
    </div>

    <!-- フッター共通挿入エリア -->
    <div id="footer-container"></div>

    <a href="#" class="pagetop" id="pageTop"></a>

    <script src="../script.js"></script>
    <script>
        window.addEventListener('load', () => {
            document.body.classList.add('loaded');
        });
    </script>
</body>
</html>
